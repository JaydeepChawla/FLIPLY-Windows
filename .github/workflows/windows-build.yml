name: Build FLIPLY Windows Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-windows:
    name: Build FLIPLY Windows App
    runs-on: windows-latest

    permissions:
      contents: write

    steps:

      # --------------------------------
      # 1. Checkout repository
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # 2. Setup Node.js
      # --------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # --------------------------------
      # 3. Install dependencies
      # --------------------------------
      - name: Install dependencies
        run: npm install

      # --------------------------------
      # 4. Build FLIPLY
      # --------------------------------
      - name: Build FLIPLY
        run: npm run dist:win -- --publish never

      # --------------------------------
      # 5. Build Windows Screen Saver
      # --------------------------------
      - name: Build Windows Screen Saver
        shell: powershell
        run: |
          if (!(Test-Path "build")) {
            New-Item -ItemType Directory -Path "build" -Force
          }

          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"

          & $csc `
            /target:winexe `
            /optimize+ `
            /platform:anycpu `
            /out:build\FLIPLY.scr `
            /reference:System.Windows.Forms.dll,System.Drawing.dll `
            electron\screensaver\FLIPLY_ScreenSaver.cs

          if (!(Test-Path "build\FLIPLY.scr")) {
            throw "FLIPLY.scr was not created."
          }

          Write-Host "FLIPLY.scr created successfully."

      # --------------------------------
      # 6. Copy Screen Saver
      # --------------------------------
      - name: Copy Screen Saver
        shell: powershell
        run: |
          Copy-Item `
            -Path "build\FLIPLY.scr" `
            -Destination "dist-electron\FLIPLY.scr" `
            -Force

          Write-Host "FLIPLY.scr copied successfully."

      # --------------------------------
      # 7. Verify Installer
      # --------------------------------
      - name: Verify FLIPLY installer
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "Files in dist-electron:"
          Get-ChildItem -Path "dist-electron" -Recurse

          if (!(Test-Path "dist-electron\FLIPLY-Setup.exe")) {
            throw "FLIPLY-Setup.exe was not created."
          }

          if (!(Test-Path "dist-electron\FLIPLY.scr")) {
            throw "FLIPLY.scr was not created."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "FLIPLY BUILD SUCCESSFUL"
          Write-Host "======================================"

      # --------------------------------
      # 8. Upload Installer Artifact
      # --------------------------------
      - name: Upload FLIPLY Installer
        uses: actions/upload-artifact@v4
        with:
          name: FLIPLY-Setup
          path: |
            dist-electron/FLIPLY-Setup.exe
            dist-electron/FLIPLY.scr
          if-no-files-found: error

      # --------------------------------
      # 9. Create GitHub Release
      # --------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"

          Write-Host "Creating FLIPLY release: $tag"

          gh release create $tag `
            "dist-electron/FLIPLY-Setup.exe" `
            --title "FLIPLY $tag" `
            --generate-notes

          Write-Host ""
          Write-Host "======================================"
          Write-Host "FLIPLY RELEASE CREATED"
          Write-Host "======================================"
