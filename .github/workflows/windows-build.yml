name: Build FLIPLY Windows Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build FLIPLY Windows App
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build React Web App
        run: npm run build

      - name: Compile Electron Main Process
        run: npm run build:electron

      - name: Compile Windows Native Screen Saver
        shell: powershell
        run: |
          if (!(Test-Path "build")) {
            New-Item -ItemType Directory -Path "build" -Force
          }

          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"

          & $csc `
            /target:winexe `
            /optimize+ `
            /platform:anycpu `
            /out:build\FLIPLY.scr `
            /reference:System.Windows.Forms.dll,System.Drawing.dll `
            electron\screensaver\FLIPLY_ScreenSaver.cs

          if (!(Test-Path "build\FLIPLY.scr")) {
            throw "FLIPLY.scr was not created."
          }

          Write-Host "FLIPLY.scr created successfully."

      - name: Verify Electron files
        shell: powershell
        run: |
          Write-Host "Checking compiled Electron files..."

          if (!(Test-Path "electron-dist\main.cjs")) {
            throw "electron-dist\main.cjs was not created."
          }

          if (!(Test-Path "electron-dist\preload.cjs")) {
            throw "electron-dist\preload.cjs was not created."
          }

          Write-Host "Electron files created successfully."

      - name: Build Windows Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Verify Windows Installer
        shell: powershell
        run: |
          Write-Host "Files in dist-electron:"
          Get-ChildItem -Path "dist-electron" -Recurse

          if (!(Test-Path "dist-electron\FLIPLY-Setup.exe")) {
            throw "FLIPLY-Setup.exe was not created."
          }

          if (!(Test-Path "dist-electron\FLIPLY-Portable.exe")) {
            throw "FLIPLY-Portable.exe was not created."
          }

          Write-Host "FLIPLY installer created successfully."

      - name: Copy Screen Saver
        shell: powershell
        run: |
          Copy-Item `
            -Path "build\FLIPLY.scr" `
            -Destination "dist-electron\FLIPLY.scr" `
            -Force

      - name: Upload FLIPLY Installer
        uses: actions/upload-artifact@v4
        with:
          name: FLIPLY-Windows
          path: |
            dist-electron/FLIPLY-Setup.exe
            dist-electron/FLIPLY.scr
          if-no-files-found: error
